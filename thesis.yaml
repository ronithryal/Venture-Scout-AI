## 3. Sourcing Gatekeepers

### Automatic Green Flags (Fast-Track to Deep Dive)

- Live product with real paying customers or engaged DAUs
- Traction at or approaching Goldilocks Zone thresholds
- Founder is shipping product updates publicly, iterating on real user feedback
- High-agency response to obstacles — they built around problems, not through them
- Technical founder who built the core product themselves
- Any background, any school, any country — if they're building something people love

### Automatic Passes (No Exceptions)

- No product in market. A deck, a business plan, a Figma prototype, a waitlist-without-product, or an idea is an immediate pass.
- Non-technical founding team that cannot build or iterate the primary product without outsourcing
- Stealth mode citing fear of idea theft — founders who won't show the product cannot be evaluated
- Broken cap table: passive entity or non-building advisor holding >25% equity
- Series C-stage or later — already consensus, already institutional, not our moment

