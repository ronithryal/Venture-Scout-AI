### Entry Criteria

**Hard minimum:** Working product that can be demonstrated + at least one external person using it (paid or free).

**Traction is contextual, not a fixed number:**
- $200 MRR growing = good. $2k MRR growing = great.
- 10 active users who didn't pay = acceptable at this stage.
- One named school, clinic, or company using the product = strong signal for B2B.
- ProductHunt launch with engagement = public validation signal.

**No pedigree requirement.** Portfolio includes founders without college degrees, international founders, non-STEM backgrounds. Execution is everything.

```
[Product Live + Any Real User] ──> [LAUNCH $125K Check] ──> [Media Distribution] ──> [Tier-1 Follow-on]
    (Pre-seed, pre-institutional)      (Post-Money SAFE)        (TWiST / Ecosystem)      (YC, a16z, Sequoia)
```

