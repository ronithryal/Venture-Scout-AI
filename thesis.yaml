## 2. Sector Thesis — Vertical AI for Any Operational Problem

The unifying pattern across LAUNCH's portfolio is: **software solving a specific operational problem in any vertical, where a smart operator-founder can build a capital-efficient solution**. The vertical can be unsexy, niche, regulated, or physically adjacent. What matters: the product is software, it scales without proportional capital, and a real human or business needs it.

**In-scope verticals (not exhaustive):**
- Construction, architecture, real estate, property tech
- Defense tech software, government AI, intelligence tools, drone tech
- Education, edtech, teacher tools, tutoring, curriculum
- Healthcare, clinical documentation, behavioral health, prior auth, telehealth
- Hourly/frontline workforce, hiring, scheduling, training, retention
- Legal, compliance, finance, accounting automation
- Niche industry analytics (motorsport, agriculture, maritime, logistics)
- E-commerce, consumer products, media, creator tools
- Developer tools, AI infrastructure, data platforms, agent frameworks
- Supply chain, transit, logistics software

**Out of scope:** Hardware manufacturing, drug discovery with lab costs, physical infrastructure requiring proportional capital per new customer.

### AI Frameworks & Agentic Infrastructure

The market for thin wrappers on frontier LLM APIs is dead. We back technical breakthroughs with structural defensibility: proprietary data flywheels, edge efficiencies, or novel orchestration architectures.

- **Agentic Orchestration:** Multi-agent systems managing complex workflows with state, memory, and self-correction. Live deployment with measurable task completion rates.
- **Edge & Local Models:** Domain-specific models running on-device or at the edge. Most compelling when tied to a paying vertical (healthcare, legal, manufacturing).
- **AI-Native Developer Infrastructure:** Shared context management, memory alignment, and CI/CD tooling for hybrid human-AI engineering teams.

### Knowledge Graphs & Contextual Intelligence

Enterprise data is fragmented. The next wave of enterprise search and automation maps relationships, not strings.

- **Executive Intelligence Engines:** Knowledge graph software synthesizing unstructured enterprise data into queryable, verifiable context. Enterprise pilots with measurable ROI are the ideal signal.
- **Dynamic Semantic Networks:** Systems extracting and graphing institutional knowledge from Slack, email, GitHub, and internal docs. Strongest when the founder has earned domain insight in the target vertical.

### Next-Generation Systems of Record

Every major enterprise software wave is anchored by who owns the underlying data layer. We source the next generation of unglamorous, deeply defensible operational backbones.

- **AI-Native SoRs:** Platforms where data entry, categorization, and reconciliation are automated via AI — replacing legacy manual management. Paying customers who have ripped out a prior system are the gold standard.
- **Continuous Compliance & Audit SoRs:** Real-time, programmatic tracking of security posture, financial compliance, and legal risk. Single source of truth for corporate governance.

### Supply Chain & Logistics Operating Systems

Legacy EDI infrastructure, fragmented communications, and geopolitical volatility create acute operational pain. We back software injecting efficiency into physical distribution.

- **Autonomous Route & Freight Optimization:** Real-time spatial telemetry and predictive rerouting. Meaningful when connected to live freight or warehouse operations.
- **Document & Visibility Automation:** Platforms converting bills of lading, customs data, and manifests into clean, programmable pipelines.

### Fintech-Crypto & On-Chain Financial Rails

We back applications merging traditional payment rails with compliant decentralized infrastructure to accelerate capital velocity.

- **Programmable Treasury Operating Systems:** Non-custodial corporate treasury with on-chain auditing, yield layers, and stablecoin-to-ACH pipelines.
- **On-Chain Settlement Primitives:** Infrastructure settling cross-border transactions in seconds while abstracting crypto complexity from the end user.
- **Privacy-First Compliance Tools:** ZK and cryptographic tooling meeting institutional compliance mandates.

