## Part 3: Output Card Format

Every deal that clears the pre-condition gate should produce a card in this format:

```
[TIER] — Company / Founder Handle
─────────────────────────────────────────────
Traction:  $X MRR (+Y% MoM) | Z DAU (+W% WoW) | [prototype stage]
Score:     X.X / 5.0  (Traction: N | Velocity: N | Market: N | Mechanics: N)
Signals:   [2-3 specific signal strings from raw data — URLs, posts, repos]
Takeaway:  [1-2 sentences: what makes this founder worth a call, or why it's a pass]
Action:    [Fast-track to call | Watch for 30 days | Wildcard hold | Archive]
```

### Example

```
[CRITICAL] — github.com/somefounder / @handle_on_x
─────────────────────────────────────────────
Traction:  $3,400 MRR (+34% MoM), 8 paying enterprise customers
Score:     4.5 / 5.0  (Traction: 5 | Velocity: 5 | Market: 4 | Mechanics: 4)
Signals:   "Show HN: I built X" — 312 points, 89 comments (2 days ago)
           GitHub repo: vercel.json + Stripe integration, 47 commits in 10 days
           X thread with live demo video, 3 customers commenting
Takeaway:  Solo founder shipped an enterprise-grade workflow tool in 6 weeks,
           already generating MRR from paying customers found through HN.
           No pedigree signals — pure execution evidence.
Action:    Fast-track to call
```
